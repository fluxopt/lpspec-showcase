description: >-
  One investment period of a capacity-expansion pathway: what to build, and
  how the fleet runs on a few typical days. The file never mentions the
  period. The solve job filters every source to one year, so this is the math
  for a year and the job decides which years, in which order, inheriting what.
version: 0

dimensions:
  day: {dtype: str, description: "typical days, each standing for many real ones"}
  hour: {dtype: int, description: "hours within a typical day"}
  generator: {dtype: str, description: "generating technologies"}

parameters:
  weight: {dims: [day], description: "how many real days this typical day represents"}
  load: {dims: [day, hour], description: "demand to be met, in MW"}
  avail: {dims: [day, hour, generator], description: "capacity factor, between 0 and 1"}
  invest: {dims: [generator], description: "annualised build cost per MW"}
  cost: {dims: [generator], description: "variable cost per MWh"}
  rate: {dims: [generator], description: "tonnes of CO2 per MWh"}
  cap: {dims: [], description: "the CO2 the year may emit, in tonnes"}
  existing: {dims: [generator], description: "capacity carried in from the previous period, in MW"}

variables:
  build:
    description: capacity added in this period
    dims: [generator]
    bounds: {lower: 0}
  total:
    description: capacity standing after this period's build, and what the next period inherits
    dims: [generator]
    bounds: {lower: 0}
  p:
    description: output of a technology in one hour of a typical day
    dims: [day, hour, generator]
    bounds: {lower: 0}

expressions:
  capex:
    description: annualised cost of what this period built
    expression: invest * build
  opex:
    description: what running each technology costs across the year
    expression: sum(sum(weight * cost * p, over=day), over=hour)
  emissions:
    description: CO2 released across the year
    expression: sum(weight * rate * p)

constraints:
  accumulate:
    description: what stands is what was carried in plus what was built
    dims: [generator]
    expression: total == existing + build
  capacity:
    description: output is capped by the standing capacity, derated by availability
    dims: [day, hour, generator]
    expression: p <= total * avail
  balance:
    description: the fleet meets the load exactly in every hour of every typical day
    dims: [day, hour]
    expression: sum(p, over=generator) == load
  carbon:
    description: the year's emissions stay under its cap
    dims: []
    expression: emissions <= cap

objective:
  sense: minimize
  description: annualised cost of what is built, plus what running it costs across the year
  expression: sum(capex) + sum(opex)
