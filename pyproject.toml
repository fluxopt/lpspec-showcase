[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lpspec-showcase"
version = "0.1.0"
description = "A capacity-expansion planner on lpspec: a solve job, an archive directory, and a static site that reads it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Felix Bumann", email = "felixbumann387@gmail.com" }]
# What a reader of the archive needs, and nothing the solve job does.
dependencies = [
    "duckdb>=1.3",
    "polars>=1.30",
    "pyarrow>=17",
]

[project.optional-dependencies]
# What the solve job needs on top. lpspec is not on PyPI yet, so the pin is a git tag.
solve = ["lpspec @ git+https://github.com/fluxopt/lpspec@v0.0.1-alpha.332"]
# What the modelling-session notebook needs on top of the solve job.
lab = ["lpspec-showcase[solve]", "marimo>=0.15", "altair>=5.4"]

[project.scripts]
showcase-solve = "showcase.solve:main"

[project.urls]
repository = "https://github.com/fluxopt/lpspec-showcase"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.hatch.metadata]
# The `solve` extra is a git tag, which a wheel's metadata may not carry without this.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/showcase"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP", "SIM", "RUF", "C4", "PIE", "RET", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is its output.
"notebooks/**/*.py" = ["B018"]

[tool.ruff.format]
quote-style = "single"
